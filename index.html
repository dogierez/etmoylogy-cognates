<style>
:root{--s-black:#000;--s-base:#121212;--s-elev:#1a1a1a;--s-high:#2a2a2a;--s-dim:#a7a7a7;--s-bright:#fff;--s-green:#1db954;--s-green-hover:#1ed760;--p-color:#8e44ad;}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
body{background-color:var(--s-black);color:var(--s-bright);display:flex;height:100vh;overflow:hidden;}
.sidebar{width:240px;background-color:var(--s-black);display:flex;flex-direction:column;padding:24px;flex-shrink:0;z-index:10;}
.sidebar h2{font-size:14px;color:var(--s-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:20px;}
.nav-link{color:var(--s-dim);text-decoration:none;font-size:14px;font-weight:bold;margin-bottom:16px;display:flex;align-items:center;cursor:pointer;transition:color 0.2s;}
.nav-link:hover,.nav-link.active{color:var(--s-bright);}
.divider{height:1px;background-color:#282828;margin:10px 0 20px 0;}
.main-view{flex:1;background-color:var(--s-base);border-radius:8px;margin:8px 8px 98px 0;display:flex;flex-direction:column;overflow-y:auto;position:relative;}
.playlist-header{padding:40px 30px;display:flex;align-items:flex-end;background:linear-gradient(transparent 0,rgba(0,0,0,.5) 100%),var(--p-color);}
.playlist-cover{width:200px;height:200px;background-color:#282828;box-shadow:0 4px 60px rgba(0,0,0,.5);margin-right:24px;border-radius:4px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:80px;}
.playlist-info p{font-size:14px;font-weight:bold;margin-bottom:8px;}
.playlist-info h1{font-size:4.5rem;font-weight:900;line-height:1.2;margin-bottom:15px;}
.playlist-info .description{color:var(--s-dim);font-weight:normal;font-size:14px;}
.action-bar{padding:24px 30px;background:linear-gradient(rgba(0,0,0,.6) 0,var(--s-base) 100%);display:flex;align-items:center;}
.big-play-btn{width:56px;height:56px;background-color:var(--s-green);border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;font-size:24px;padding-left:5px;transition:all 0.2s;flex-shrink:0;}
.big-play-btn:hover{background-color:var(--s-green-hover);transform:scale(1.05);}
.action-btn{background-color:transparent;color:var(--s-bright);border:1px solid #535353;border-radius:20px;padding:10px 20px;margin-left:15px;cursor:pointer;font-weight:bold;font-size:15px;transition:all 0.2s;}
.action-btn:hover{border-color:var(--s-bright);transform:scale(1.02);background-color:rgba(255,255,255,0.1);}
.transcript-container{margin:0 30px 20px 30px;padding:0 24px 24px 24px;background-color:var(--s-elev);border-radius:8px;display:none;line-height:1.8;font-size:1.15rem;border-left:4px solid #9b59b6;transition:all 0.3s ease;}
.transcript-container.show{display:block;}
.transcript-container.fullscreen{position:fixed;top:0;left:0;width:100vw;height:calc(100vh - 90px);z-index:9999;margin:0;border-radius:0;background-color:var(--s-base);border-left:none;border-top:4px solid #9b59b6;padding:2vh 5vw;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-start;}
.transcript-container.fullscreen .transcript-header{margin-bottom:1.5vh;padding:2vh 0 1vh 0;border-bottom:1px solid #333;}
.transcript-container.fullscreen h3{font-size:4.5vh;}
.transcript-container.fullscreen p{font-size:3vh;line-height:1.5;margin-bottom:1.5vh;}
.transcript-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:20px 0 15px 0;border-bottom:1px solid #333;position:sticky;top:0;background-color:var(--s-elev);z-index:10;}
.transcript-container.fullscreen .transcript-header{background-color:var(--s-base);}
.transcript-header h3{color:#9b59b6;text-shadow:0 0 8px rgba(155,89,182,0.5);font-size:1.8rem;margin:0;}
.transcript-container p{margin-bottom:20px;}
.dict-word{border-bottom:1px dashed var(--s-dim);cursor:pointer;transition:all 0.2s;}
.dict-word.active{border-bottom:none;font-weight:bold;}
.neon-en{color:#39ff14;text-shadow:0 0 8px rgba(57,255,20,0.4);}
.neon-tr{color:#fbff00;text-shadow:0 0 8px rgba(255,255,0,0.4);}
.track-list-container{padding:0 30px 40px 30px;}
.track-list-header{display:grid;grid-template-columns:40px 1fr 150px;padding:5px 16px;border-bottom:1px solid #282828;color:var(--s-dim);font-size:13px;letter-spacing:1px;margin-bottom:16px;}
.track-item{display:grid;grid-template-columns:40px 1fr 150px;align-items:center;padding:10px 16px;border-radius:4px;cursor:pointer;transition:background-color 0.2s;color:var(--s-dim);}
.track-item:hover{background-color:var(--s-high);color:var(--s-bright);}
.track-item.playing,.track-item.playing .track-title{color:var(--s-green);}
.track-number{font-variant-numeric:tabular-nums;font-size:14px;}
.track-item:hover .track-number{display:none;}
.track-item:hover::before{content:"▶";width:40px;color:var(--s-bright);font-size:12px;display:block;}
.track-info{display:flex;flex-direction:column;overflow:hidden;}
.track-title{color:var(--s-bright);font-size:16px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-artist{font-size:13px;}
.track-album{font-size:14px;}
.player-bar{position:fixed;bottom:0;left:0;width:100%;height:90px;background-color:var(--s-black);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-top:1px solid #282828;z-index:10000;}
.now-playing-section{width:30%;display:flex;align-items:center;overflow:hidden;}
.now-playing-art{font-size:32px;margin-right:10px;}
.now-playing-info{display:flex;flex-direction:column;overflow:hidden;margin-left:10px;}

.np-artist{color:var(--s-dim);font-size:12px;}
.controls-section{width:40%;display:flex;flex-direction:column;align-items:center;}
.buttons{display:flex;align-items:center;gap:24px;margin-bottom:8px;}
.control-btn{background:none;border:none;color:var(--s-dim);font-size:18px;cursor:pointer;transition:color 0.2s;}
.control-btn:hover{color:var(--s-bright);}
.play-pause-btn{background-color:var(--s-bright);color:var(--s-black);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;padding-left:3px;}
.play-pause-btn.playing{padding-left:0;}
.play-pause-btn:hover{transform:scale(1.05);color:var(--s-black);}
.progress-container{display:flex;align-items:center;width:100%;max-width:600px;gap:8px;font-size:11px;color:var(--s-dim);}
.progress-bar{flex:1;height:4px;background-color:#535353;border-radius:2px;cursor:pointer;position:relative;}
.progress-fill{height:100%;background-color:var(--s-bright);border-radius:2px;width:0%;}
.progress-bar:hover .progress-fill{background-color:var(--s-green);}
.right-section{width:30%;}
@media (max-width:768px){
body{flex-direction:column;}.sidebar{display:none;}.main-view{margin:0;border-radius:0;margin-bottom:120px;}.playlist-header{flex-direction:column;align-items:center;text-align:center;padding:30px 20px;}.playlist-cover{margin-right:0;margin-bottom:20px;width:160px;height:160px;font-size:64px;}.playlist-info h1{font-size:2.5rem;}.action-bar{flex-direction:column;padding:15px 20px;gap:15px;}.action-btn{margin-left:0;width:100%;text-align:center;}.transcript-container{margin:0 15px 20px 15px;padding:0 20px 20px 20px;}.transcript-container.fullscreen{padding:0 15px 20px 15px;}.transcript-header{flex-direction:column;gap:15px;}.track-list-container{padding:0 15px 40px 15px;}.track-list-header{grid-template-columns:40px 1fr;}.track-list-header div:nth-child(3){display:none;}.track-item{grid-template-columns:40px 1fr;}.track-album{display:none;}.player-bar{height:110px;flex-direction:column;justify-content:center;padding:10px 15px;}.now-playing-section{width:100%;justify-content:center;margin-bottom:8px;}.np-title{text-align:center;font-size:15px;}.np-artist{display:none;}.controls-section{width:100%;}.buttons{margin-bottom:8px;gap:35px;}.control-btn{font-size:22px;}.play-pause-btn{width:40px;height:40px;}.right-section{display:none;}

const transcriptText=document.getElementById('h-transcript-text');

let currentTrackIndex=null;
let isPlaying=false;
let delayTimeout=null;

function formatTranscriptWithDict(text,trackDictionary){
    if(!trackDictionary)return text;
    return text.replace(/\b([a-zA-Z]+)\b/g,function(match){
        let lowerMatch=match.toLowerCase();
        if(trackDictionary[lowerMatch]){
            return `<span class="dict-word" data-en="${match}" data-tr="${trackDictionary[lowerMatch]}">${match}</span>`;
        }
        return match;
    });
}

function renderTracks(){
    trackContainer.innerHTML='';
    tracks.forEach((track,index)=>{
        const div=document.createElement('div');
        div.className='track-item';
        if(index===currentTrackIndex&&audioPlayer.src!=='')div.classList.add('playing');
        div.innerHTML=`<div class="track-number">${index+1}</div><div class="track-info"><div class="track-title">${track.title}</div><div class="track-artist">Pronunciation Practice</div></div><div class="track-album">Etymology Cognates</div>`;
        div.onclick=()=>playTrack(index);
        trackContainer.appendChild(div);
    });
}

function playTrack(index){
    if(delayTimeout)clearTimeout(delayTimeout);
    currentTrackIndex=index;
    const track=tracks[index];
    nowPlayingTitle.textContent=track.title;
    nowPlayingArtist.textContent="Pronunciation Practice";
    if(npArt)npArt.style.display="block";
    transcriptTitle.textContent=track.title;
    transcriptText.innerHTML=formatTranscriptWithDict(track.text,track.dictionary);
    const targetSrc=encodeURI(track.src);
    if(!audioPlayer.src.includes(targetSrc)){audioPlayer.src=track.src;}
    audioPlayer.play().catch(e=>console.log(e));
    isPlaying=true;
    updatePlayButtons(true);
    renderTracks();
}

function togglePlayPause(){
    if(!audioPlayer.src){if(tracks.length>0)playTrack(0);return;}
    if(isPlaying){
        audioPlayer.pause();
        isPlaying=false;
        updatePlayButtons(false);
    }else{
        audioPlayer.play();
        isPlaying=true;
        updatePlayButtons(true);
    }
}

function updatePlayButtons(playing){
    if(playing){
        playPauseBtn.textContent='⏸';
        playPauseBtn.classList.add('playing');
        mainPlayBtn.textContent='⏸';
        mainPlayBtn.style.paddingLeft='0';
    }else{
        playPauseBtn.textContent='▶';
        playPauseBtn.classList.remove('playing');
        mainPlayBtn.textContent='▶';
        mainPlayBtn.style.paddingLeft='5px';
    }
}

function playNext(){
    if(currentTrackIndex!==null&&currentTrackIndex<tracks.length-1)playTrack(currentTrackIndex+1);
}

function playPrev(){
    if(currentTrackIndex!==null&&currentTrackIndex>0)playTrack(currentTrackIndex-1);
    else if(audioPlayer.currentTime>3)audioPlayer.currentTime=0;
}

playPauseBtn.addEventListener('click',togglePlayPause);
mainPlayBtn.addEventListener('click',togglePlayPause);

transcriptToggleBtn.addEventListener('click',()=>{

    }else{
        transcriptToggleBtn.textContent='📖 Show Transcript';
        fullscreenBtn.style.display='none';
        transcriptContainer.classList.remove('fullscreen');
        fullscreenBtn.textContent='⛶ Full Screen';
        document.body.style.overflow='';
    }
});

fullscreenBtn.addEventListener('click',()=>{
    transcriptContainer.classList.toggle('fullscreen');
    if(transcriptContainer.classList.contains('fullscreen')){
        fullscreenBtn.textContent='✖ Exit Full Screen';
        document.body.style.overflow='hidden';
    }else{
        fullscreenBtn.textContent='⛶ Full Screen';
        document.body.style.overflow='';
    }
});

transcriptText.addEventListener('click',function(e){
    const target=e.target.closest('.dict-word');
    if(target){
        if(target.classList.contains('active')){
            target.classList.remove('active');
            target.innerHTML=target.getAttribute('data-en');
        }else{
            target.classList.add('active');
            const enWord=target.getAttribute('data-en');
            const trWord=target.getAttribute('data-tr');
            target.innerHTML=`<span class="neon-en">${enWord}</span> <span class="neon-tr">[${trWord}]</span>`;
        }
    }
});

nextBtn.addEventListener('click',()=>{if(delayTimeout)clearTimeout(delayTimeout);playNext();});
prevBtn.addEventListener('click',()=>{if(delayTimeout)clearTimeout(delayTimeout);playPrev();});

audioPlayer.addEventListener('ended',()=>{delayTimeout=setTimeout(()=>{playNext();},3000);});

audioPlayer.addEventListener('timeupdate',()=>{
    if(audioPlayer.duration){
        const percent=(audioPlayer.currentTime/audioPlayer.duration)*100;
        progressFill.style.width=`${percent}%`;
        currentTimeEl.textContent=formatTime(audioPlayer.currentTime);
    }
});

audioPlayer.addEventListener('loadedmetadata',()=>{durationEl.textContent=formatTime(audioPlayer.duration);});

progressBar.addEventListener('click',(e)=>{
    if(!audioPlayer.duration)return;
    const rect=progressBar.getBoundingClientRect();
    const pos=(e.clientX-rect.left)/rect.width;
    audioPlayer.currentTime=pos*audioPlayer.duration;
});

function formatTime(seconds){
    if(isNaN(seconds))return"0:00";
    const mins=Math.floor(seconds/60);
    const secs=Math.floor(seconds%60);
    return`${mins}:${secs<10?'0':''}${secs}`;
}

renderTracks();
</script>
</body>
</html>
